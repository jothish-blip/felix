name: Reusable FELIX Security Assessment

on:
  workflow_call:
    inputs:
      target_url:
        description: 'Authorized target URL to assess'
        required: true
        type: string
      policy_file:
        description: 'Path to security threshold policy file (e.g. .felix-policy.yaml)'
        required: false
        type: string
        default: ''
      baseline_ref:
        description: 'Baseline execution or snapshot identifier for finding delta comparison'
        required: false
        type: string
        default: ''
      baseline_scope:
        description: 'Scope for policy threshold evaluation: all (default), new, new_and_regressed'
        required: false
        type: string
        default: 'all'
      output_dir:
        description: 'Directory where machine-readable reports will be saved'
        required: false
        type: string
        default: 'felix-reports'
      timeout:
        description: 'Network timeout duration (e.g. 10s, 30s, 1m)'
        required: false
        type: string
        default: '30s'
      upload_sarif:
        description: 'Automatically upload SARIF report to GitHub Code Scanning'
        required: false
        type: boolean
        default: true
      upload_artifacts:
        description: 'Automatically upload generated reports as workflow artifacts'
        required: false
        type: boolean
        default: true
      pr_comment:
        description: 'Publish or update Pull Request summary comment on GitHub'
        required: false
        type: boolean
        default: false
      pr_inline:
        description: 'Publish inline code review comments on GitHub for findings with source locations'
        required: false
        type: boolean
        default: false
      feedback_failure_policy:
        description: 'Failure behavior if PR feedback fails: warn (default) or fail'
        required: false
        type: string
        default: 'warn'
    outputs:
      exit_code:
        description: 'Assessment execution exit code'
        value: ${{ jobs.assess.outputs.exit_code }}
      policy_status:
        description: 'Policy evaluation status'
        value: ${{ jobs.assess.outputs.policy_status }}
      findings_count:
        description: 'Total detected security findings'
        value: ${{ jobs.assess.outputs.findings_count }}
      sarif_path:
        description: 'Path to generated SARIF 2.1.0 report'
        value: ${{ jobs.assess.outputs.sarif_path }}
      json_path:
        description: 'Path to generated JSON report'
        value: ${{ jobs.assess.outputs.json_path }}
      html_path:
        description: 'Path to generated HTML report'
        value: ${{ jobs.assess.outputs.html_path }}
      feedback_published:
        description: 'Whether pull request feedback was published successfully'
        value: ${{ jobs.assess.outputs.feedback_published }}

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write

jobs:
  assess:
    name: FELIX Security Policy Gate
    runs-on: ubuntu-latest
    outputs:
      exit_code: ${{ steps.felix.outputs.exit-code }}
      policy_status: ${{ steps.felix.outputs.policy-status }}
      findings_count: ${{ steps.felix.outputs.findings-count }}
      sarif_path: ${{ steps.felix.outputs.sarif-path }}
      json_path: ${{ steps.felix.outputs.json-path }}
      html_path: ${{ steps.felix.outputs.html-path }}
      feedback_published: ${{ steps.felix.outputs.feedback-published }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go Toolchain
        uses: actions/setup-go@f111f330738ebb33059ca3288e89eb47411ba7b6 # v5.3.0
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Build and Verify FELIX
        run: |
          go build -trimpath -ldflags="-s -w" -o bin/felix ./cmd/felix
          ./bin/felix ci --verify-bin ./bin/felix

      - name: Run FELIX Assessment Action
        id: felix
        uses: ./.github/actions/felix-action
        with:
          target: ${{ inputs.target_url }}
          policy: ${{ inputs.policy_file }}
          baseline: ${{ inputs.baseline_ref }}
          baseline-scope: ${{ inputs.baseline_scope }}
          output-dir: ${{ inputs.output_dir }}
          timeout: ${{ inputs.timeout }}
          felix-path: ./bin/felix
          upload-sarif: ${{ inputs.upload_sarif }}
          upload-artifacts: ${{ inputs.upload_artifacts }}
          pr-comment: ${{ inputs.pr_comment }}
          pr-inline: ${{ inputs.pr_inline }}
          feedback-failure-policy: ${{ inputs.feedback_failure_policy }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
