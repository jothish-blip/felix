name: Release Felix

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Multi-Platform Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true

      - name: Verify Code Quality & Static Analysis
        run: |
          go vet ./...
          go build ./...

      - name: Run Test Suite
        run: |
          go test -v -count=1 ./...

      - name: Run Deterministic Benchmark Certification
        run: |
          go run ./benchmarks --synthetic-only

      - name: Build Cross-Platform Release Artifacts
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="${{ github.event.inputs.version || '1.0.0' }}"
          fi
          chmod +x scripts/release/build.sh
          ./scripts/release/build.sh "$VERSION"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: "Felix Security Auditor ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
